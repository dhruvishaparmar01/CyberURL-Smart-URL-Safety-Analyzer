<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cyberUrl - Sign Up</title>
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      
      <div class="card-header">
        <h1>Create Account</h1>
        <p>Join cyberUrl and secure your personal journey</p>
      </div>

      <form id="signup-form">
        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Enter Password" required>
            <span class="toggle-password" id="toggle-password">
              <!-- Eye Icon (Open) -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="input-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirm_password" placeholder="Confirm Password" required>
            <span class="toggle-password" id="toggle-confirm">
              <!-- Eye Icon (Open) -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
          </div>
        </div>

        <!-- Single Error Message Container -->
        <div id="error-message"></div>

        <button type="submit" class="auth-btn">
            Sign Up
        </button>

      </form>

      <div class="card-footer">
        <p>Already have an account? <a href="index.html">Log In</a></p>
      </div>

    </div>
  </main>


<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system;
}

body {
  background-color: #07111F;
  color: #ffffff;
}

.auth-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 40px 20px;
  
  background-image: 
    radial-gradient(circle at 10% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.1) 0%, transparent 50%);
}

.auth-card {
  width: 100%;
  max-width: 440px;
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  padding: 45px 40px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
}

.card-header {
  text-align: center;
  margin-bottom: 35px;
}

.card-header h1 {
  font-size: 28px;
  font-weight: 400;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.card-header p {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.6);
  line-height: 1.5;
}

.input-group {
  margin-bottom: 20px;
}

.input-group label {
  display: block;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.7);
  margin-bottom: 8px;
}

.input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  color: #ffffff;
  font-size: 14px;
  outline: none;
  transition: all 0.3s ease;
  padding-right: 45px;
}

.input-group input::placeholder {
  color: rgba(255, 255, 255, 0.3);
}

.input-group input:focus {
  border-color: rgba(0, 212, 255, 0.6);
  background: rgba(255, 255, 255, 0.08);
}

/* Eye Toggle Styling */
.toggle-password {
  position: absolute;
  right: 15px;
  cursor: pointer;
  color: rgba(255, 255, 255, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.3s;
}

.toggle-password:hover {
  color: rgba(255, 255, 255, 0.9);
}

.toggle-password svg {
  width: 20px;
  height: 20px;
}

.auth-btn {
  width: 100%;
  padding: 14px;

  background-color: #ffffff;
  color: #111;

  border: none;
 
  border-radius: 30px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.1s;
  margin-top: 5px;
  margin-bottom: 30px;
}

#error-message {
    color: #ff4d4d;
    margin-bottom: 15px;
    font-size: 13px;
    line-height: 1.4;
    text-align: left; 
}

.auth-btn:hover {
  background-color: #f0f0f0;
}

.auth-btn:active {
  transform: scale(0.98);
}

.card-footer {
  text-align: center;
 
  font-size: 13px;
  color: rgba(255, 255, 255, 0.6);
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: 25px;
}

.card-footer a {
  color: #ffffff;
  text-decoration: none;
    font-weight: 500;
  margin-left: 4px;
}

.card-footer a:hover {
  text-decoration: underline;
}
</style>

<script type="module">
  // Supabase
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  // Connect database
  const supabaseUrl = 'https://dsxkjamhwzxmwkcgujzg.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzeGtqYW1od3p4bXdrY2d1anpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDg3NDUsImV4cCI6MjEwMTY4NDc0NX0.HJjwXT21opcexDsMIXmCl0CS8ITeYk7jAx-g_ZxNcUg';
  const supabase = createClient(supabaseUrl, supabaseKey);

  const signupForm = document.getElementById('signup-form');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password'); 
  const confirmPasswordInput = document.getElementById('confirm_password'); 
  const errorMessage = document.getElementById('error-message');

  // SVG Icons for the Toggle
  const eyeOpenIcon = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>`;
    
  const eyeClosedIcon = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
      <line x1="1" y1="1" x2="23" y2="23"></line>
    </svg>`;

  // Password Toggle Functionality
  function setupPasswordToggle(toggleBtnId, inputFieldId) {
    const toggleBtn = document.getElementById(toggleBtnId);
    const inputField = document.getElementById(inputFieldId);

    toggleBtn.addEventListener('click', function () {


      const type = inputField.getAttribute('type') === 'password' ? 'text' : 'password';
      inputField.setAttribute('type', type);
      
      toggleBtn.innerHTML = type === 'password' ? eyeOpenIcon : eyeClosedIcon;
    });
  }

  setupPasswordToggle('toggle-password', 'password');
  setupPasswordToggle('toggle-confirm', 'confirm_password');


  // Strict Password Validation Function
  function validateRegistration(password, confirmPassword) {
      let errors = [];

      if (password.length < 8 || password.length > 32) {
          errors.push("Password must be between 8 and 32 characters.");
      }
      if (!/[A-Z]/.test(password)) {
          errors.push("Password must contain at least one uppercase letter.");
      }
      if (!/[a-z]/.test(password)) {
          errors.push("Password must contain at least one lowercase letter.");
      }
      if (!/\d/.test(password)) {
          errors.push("Password must contain at least one number.");
      }
      if (!/[!@#$%^&*(),.?":{}|<>\-_~]/.test(password)) {
          errors.push("Password must contain at least one special character.");
      }
      if (/\s/.test(password)) {
          errors.push("Password must not contain any spaces.");
      }
      if (password !== confirmPassword) {
          errors.push("Passwords do not match.");
      }

      return {
          isValid: errors.length === 0,
          errors: errors
      };
  }

  // submit click
  signupForm.addEventListener('submit', async function(event) {
    
    event.preventDefault();

    errorMessage.style.color = '#ff4d4d';
     errorMessage.innerHTML = ''; 

    const nameValue = nameInput.value.trim();
     const emailValue = emailInput.value.trim();
    const passwordValue = passwordInput.value.trim();
    const confirmPasswordValue = confirmPasswordInput.value.trim(); 

    // Basic Field Validation 
    if (nameValue.length < 2) {
      errorMessage.innerHTML = 'Please enter your full name.';
      return; 
    }

    if (emailValue === '') {
      errorMessage.innerHTML = 'Please provide a valid email address.';
      return;
    }

    // Password Validation
    const passwordValidation = validateRegistration(passwordValue, confirmPasswordValue);
    
    if (!passwordValidation.isValid) {

      errorMessage.innerHTML = passwordValidation.errors.join('<br>');
        return;
    }
    
    errorMessage.style.color = '#24b47e'; 
    errorMessage.innerHTML = 'Creating your account...';

    // Tell Supabase to register the user
    const { data, error } = await supabase.auth.signUp({
      email: emailValue,
      password: passwordValue,
    });

    // Handle the Supabase response
    if (error) {
      errorMessage.style.color = '#ff4d4d'; 
      errorMessage.innerHTML = error.message; 
    } else {
      errorMessage.innerHTML = 'Success! Redirecting to login...';
      window.location.href = 'index.html'; 
    }
  });
</script>

</body>
</html>
