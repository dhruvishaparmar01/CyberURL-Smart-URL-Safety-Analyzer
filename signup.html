<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cyberUrl - Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      
      <div class="card-header">
        <h1>Create Account</h1>
        <p>Join cyberUrl and secure your personal journey</p>
      </div>

      <form id="signup-form">
        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required>
        </div>

        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>


        <div id="error-message"></div>

        <div class="input-group">
    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter Password"
    >
</div>

<div id="error-message"></div>

<button type="submit" class="auth-btn">
    Sign Up
</button>

      </form>

      <div class="card-footer">
        <p>Already have an account? <a href="index.html">Log In</a></p>
      </div>

    </div>
  </main>


<style>
    
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system;
}

body {
  background-color: #07111F;
  color: #ffffff;
}


.auth-wrapper {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 40px 20px;
  
  background-image: 
    radial-gradient(circle at 10% 20%, rgba(0, 212, 255, 0.1) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(138, 43, 226, 0.1) 0%, transparent 50%);
}


.auth-card {
  width: 100%;
  max-width: 440px;
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  padding: 45px 40px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
}

.card-header {
  text-align: center;
  margin-bottom: 35px;
}

.card-header h1 {
  font-size: 28px;
  font-weight: 400;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.card-header p {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.6);
  line-height: 1.5;
}


.input-group {
  margin-bottom: 20px;
}

.input-group label {
  display: block;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.7);
  margin-bottom: 8px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  color: #ffffff;
  font-size: 14px;
  outline: none;
  transition: all 0.3s ease;
}

.input-group input::placeholder {
  color: rgba(255, 255, 255, 0.3);
}

.input-group input:focus {
  border-color: rgba(0, 212, 255, 0.6);
  background: rgba(255, 255, 255, 0.08);
}


.auth-btn {
  width: 100%;
  padding: 14px;
  background-color: #ffffff;
  color: #111;
  border: none;
  border-radius: 30px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.1s;
  margin-top: 15px;
  margin-bottom: 30px;
}

#error-message{
    color:#ff4d4d;
    margin-top:10px;
    margin-bottom:15px;
    font-size:14px;
    text-align:center;
}

.auth-btn:hover {
  background-color: #f0f0f0;
}

.auth-btn:active {
  transform: scale(0.98);
}

.card-footer {
  text-align: center;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.6);
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  padding-top: 25px;
}

.card-footer a {
  color: #ffffff;
  text-decoration: none;
  font-weight: 500;
  margin-left: 4px;
}

.card-footer a:hover {
  text-decoration: underline;
}


</style>

<script type="module">
  // Supabase
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  // 2. Connect database
  const supabaseUrl = 'https://dsxkjamhwzxmwkcgujzg.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzeGtqYW1od3p4bXdrY2d1anpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDg3NDUsImV4cCI6MjEwMTY4NDc0NX0.HJjwXT21opcexDsMIXmCl0CS8ITeYk7jAx-g_ZxNcUg';
  const supabase = createClient(supabaseUrl, supabaseKey);

  const signupForm = document.getElementById('signup-form');

  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password'); 

  const errorMessage = document.getElementById('error-message');

  // submit click
  signupForm.addEventListener('submit', async function(event) {
    
    // Stop refreshing 
    event.preventDefault();

    errorMessage.style.color = '#ff4d4d';
    errorMessage.textContent = '';

    // Get the exact text typed and trim invisible spaces
    const nameValue = nameInput.value.trim();
    const emailValue = emailInput.value.trim();
    const passwordValue = passwordInput.value.trim();

    // VALIDATION 
    if (nameValue.length < 2) {
      errorMessage.textContent = 'Please enter your full name.';
      return; 
    }

    if (emailValue === '') {
      errorMessage.textContent = 'Please provide a valid email address.';
      return;
    }

    if (passwordValue.length < 6) {
      errorMessage.textContent = 'Your password must be at least 6 characters long for security.';
      return;
    }

    
    errorMessage.style.color = '#24b47e'; 
    errorMessage.textContent = 'Creating your account...';

    // Tell Supabase to register the user
    const { data, error } = await supabase.auth.signUp({
      email: emailValue,
      password: passwordValue,
    });

    // Handle the Supabase response
    if (error) {
      errorMessage.style.color = '#ff4d4d'; // Switch back to red for errors
      errorMessage.textContent = error.message; // Show the actual Supabase error 
    } else {
      errorMessage.textContent = 'Success! Redirecting to login...';
      // Redirect to the login page
      window.location.href = 'index.html'; 
    }
  });
</script>

</body>
</html>
